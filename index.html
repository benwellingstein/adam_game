<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>האוס 30</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; touch-action: none; user-select: none; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,20,60,0.72); color: white;
      font-family: 'Courier New', monospace; text-align: center; padding: 20px;
      direction: rtl; unicode-bidi: plaintext;
    }
    #overlay h1 { font-size: clamp(1.8rem,6vw,4rem); margin-bottom:.8rem; line-height:1.2; }
    #overlay p  { font-size: clamp(1rem,3vw,1.5rem); opacity:.88; margin-top:.4rem; }
    #overlay.hidden { display: none; }
    #pb { position:fixed; bottom:0; left:0; right:0; height:6px; background:rgba(0,0,0,.2); }
    #pf { height:100%; width:0%; background:linear-gradient(90deg,#44aaff,#ff44aa); }
    #pb.hidden { display:none; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="pb" class="hidden"><div id="pf"></div></div>
<div id="overlay">
  <h1 id="ov-t">אוס 30</h1>
  <p  id="ov-s">שנייה טוען...</p>
</div>
<audio id="audio" preload="auto"></audio>
<script>
const SONG = 'SVERDY%20ADAM%20BALAGAN%20HOUSE%2030%20%5BNew%20Mix%5D%20-%20%5BPRECISE%20MASTER%5D%2044.1Khz%20320Kbps.mp3';
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const ovEl   = document.getElementById('overlay');
const ovT    = document.getElementById('ov-t');
const ovS    = document.getElementById('ov-s');
const pb     = document.getElementById('pb');
const pf     = document.getElementById('pf');
const audio  = document.getElementById('audio');
audio.src = SONG;

// ── Ars images ────────────────────────────────────────────────────────────────
const arsImgs = [1,2,3].map(n => { const img = new Image(); img.src = `Images/ars${n}.png`; return img; });
const missileImg = new Image(); missileImg.src = 'Images/missile.png';

// ── Sound effects ─────────────────────────────────────────────────────────────
function playSound(snd) { snd.currentTime = 0; snd.play().catch(() => {}); }
const sfxJump     = new Audio('sounds/jump.mp3');
const sfxDeaths   = [new Audio('sounds/death.mp3'), new Audio('sounds/death2.mp3')];
const sfxArsim    = [1,2,3,4,5].map(n => new Audio(`sounds/arsim/ars${n}.mp3`));
const sfxMissiles = [
  new Audio('sounds/missiles/missile1.mp3'),
  new Audio('sounds/missiles/missile2.mp3'),
  new Audio('sounds/missiles/missile%203.mp3')
];

let songDuration = 139.781;
const S = { LOADING:0, READY:1, PLAYING:2, DEAD:3, ENDING:4, CELEBRATION:5 };
let state = S.LOADING, fc = 0;

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
window.addEventListener('resize', () => { resize(); initRunner(); });
resize();

const GND = () => canvas.height - Math.max(90, canvas.height * 0.13);

// ── Runner ────────────────────────────────────────────────────────────────────
const R = { x:0, y:0, vy:0, onGround:true, entering:false, alpha:1, angle:0, deadVY:0 };
const GRAV = 0.75;
const JV   = () => -Math.sqrt(2 * GRAV * canvas.height * 0.34);

function initRunner() {
  R.x = Math.max(120, canvas.width * 0.13);
  R.y = GND(); R.vy = 0; R.onGround = true; R.entering = false; R.alpha = 1;
  R.angle = 0; R.deadVY = 0;
}

// ── Game vars ─────────────────────────────────────────────────────────────────
let obstacles = [], spawnTimer = 0, nextSpawn = 90;
let speed = 5, gndScroll = 0;
let houseX = 0, houseActive = false;
let confetti = [], fireworks = [], celebTick = 0;
let deadTick = 0;
let isNight = false, moonOff = 0, moonAlpha = 0;
let totalScroll = 0;

// Ground imperfections — generated once, tiled at BUMP_TILE intervals
const BUMP_TILE = 1200;
const gndBumps = [];
for (let i = 0; i < 60; i++) {
  gndBumps.push({
    x: Math.random() * BUMP_TILE,
    h: 1 + Math.floor(Math.random() * 3),
    w: 2 + Math.floor(Math.random() * 7)
  });
}

function randSpawn() { return 80 + Math.random() * 80; }

// ── Input ─────────────────────────────────────────────────────────────────────
function onTap() {
  if (state === S.READY) { startGame(); return; }
  if (state === S.DEAD || state >= S.ENDING) return;
  if (R.onGround) { R.vy = JV(); R.onGround = false; playSound(sfxJump); }
}
function onRelease() {
  if (state === S.PLAYING && !R.onGround && R.vy < 0) R.vy *= 0.4;
}
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); onTap(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') onRelease();
});
document.addEventListener('touchstart', e => { e.preventDefault(); onTap(); }, { passive:false });
document.addEventListener('touchend',   e => { e.preventDefault(); onRelease(); }, { passive:false });
document.addEventListener('mousedown', () => onTap());
document.addEventListener('mouseup',   () => onRelease());

// ── Audio ─────────────────────────────────────────────────────────────────────
audio.addEventListener('loadedmetadata', () => { songDuration = audio.duration || songDuration; goReady(); });
audio.addEventListener('error', goReady);

function goReady() {
  state = S.READY;
  ovT.innerHTML = 'האוס 30<br>מסעו של סברדי';
  ovS.textContent = 'תעזרו לסברדי להגיע לאולפן של אדם בלאגן כדי שהם יוכלו לבשל באנגרים\nרק תזהרו שלא להדקר בדרך וגם שלא יתפסו אתכם האירנים המנייק\nבהצלחה…';
  ovEl.classList.remove('hidden');
  initRunner();
}

function startGame() {
  state = S.PLAYING; ovEl.classList.add('hidden'); pb.classList.remove('hidden');
  obstacles = []; spawnTimer = 0; nextSpawn = randSpawn();
  speed = 5; gndScroll = 0; houseActive = false; houseX = 0;
  confetti = []; fireworks = []; celebTick = 0;
  isNight = false; moonOff = 0; moonAlpha = 0; totalScroll = 0;
  initRunner();
  audio.currentTime = 0; audio.play().catch(() => {});
}

// ── UPDATE ────────────────────────────────────────────────────────────────────
function update(dt) {
  fc += dt;
  if      (state === S.PLAYING)     updatePlaying(dt);
  else if (state === S.ENDING)      updateEnding(dt);
  else if (state === S.DEAD)        updateDead(dt);
  else if (state === S.CELEBRATION) updateCeleb(dt);
}

function physicsStep(dt) {
  if (!R.onGround) {
    R.vy += GRAV * dt; R.y += R.vy * dt;
    if (R.y >= GND()) { R.y = GND(); R.vy = 0; R.onGround = true; }
  }
}

function advanceMoon(spd, dt) {
  moonOff = (moonOff + spd * 0.12) % (canvas.width * 8);
  if (isNight) moonAlpha = Math.min(1, moonAlpha + 0.006 * dt);
}

function updatePlaying(dt) {
  speed = 5 + Math.min(audio.currentTime * 0.025, 5);
  gndScroll = (gndScroll + speed * dt) % 80;
  totalScroll += speed * dt;
  isNight = !isNaN(audio.currentTime) && audio.currentTime >= songDuration / 2;
  advanceMoon(speed * dt, dt);
  physicsStep(dt);

  const left = songDuration - audio.currentTime;
  if (!isNaN(left) && left <= 2 && !houseActive) {
    state = S.ENDING; houseActive = true; houseX = canvas.width + 30; obstacles = []; return;
  }

  spawnTimer += dt;
  if (spawnTimer >= nextSpawn) { spawnTimer = 0; nextSpawn = randSpawn(); spawnObstacle(); }
  obstacles = obstacles.filter(o => { o.x -= speed * dt; return o.x > -150; });

  for (const o of obstacles) {
    if (o.sfxDone) continue;
    if (o.type === 'ars' && o.x < R.x) {
      o.sfxDone = true;
      if (Math.random() < 2/3) playSound(sfxArsim[Math.floor(Math.random() * sfxArsim.length)]);
    } else if (o.type === 'rocket' && o.x < R.x) {
      o.sfxDone = true;
      if (Math.random() < 2/3) playSound(sfxMissiles[Math.floor(Math.random() * sfxMissiles.length)]);
    }
  }

  const hit = collides(); if (hit) killRunner(hit);
  if (!isNaN(audio.duration)) pf.style.width = (audio.currentTime / audio.duration * 100) + '%';
}

function spawnObstacle() {
  if (Math.random() < 0.28) {
    const altPx = [GND() * 0.42, GND() * 0.60, GND() * 0.78][Math.floor(Math.random() * 3)];
    obstacles.push({ type:'rocket', x: canvas.width + 80, y: altPx });
  } else {
    const count = Math.random() < 0.5 ? 1 : Math.random() < 0.6 ? 2 : 3;
    const tall  = Math.random() < 0.5;
    const imgIdxs = Array.from({length: count}, () => Math.floor(Math.random() * 3));
    obstacles.push({ type:'ars', x: canvas.width + 60, y: GND(), count, tall, imgIdxs });
  }
}

function runnerBox() { return { x:R.x-12, y:R.y-64, w:24, h:62 }; }
function aabb(a, bx, by, bw, bh) {
  return a.x < bx+bw && a.x+a.w > bx && a.y < by+bh && a.y+a.h > by;
}

function collides() {
  const rb = runnerBox();
  for (const o of obstacles) {
    if (o.type === 'ars') {
      const gw = o.count * 34 + (o.count - 1) * 6;
      const gh = o.tall ? 80 : 62;
      if (aabb(rb, o.x - gw/2 + 5, o.y - gh + 6, gw - 10, gh - 6)) return 'ars';
    } else {
      if (aabb(rb, o.x - 22, o.y - 9, 44, 18)) return 'rocket';
    }
  }
  return null;
}

let lastKiller = null;
const ARS_DEATH_TEXTS = [
  ['נהוראי השרמיט שם בך', 'נסה שוב הפעם בלי להדקר כמו שמאלן'],
  ['אחח איזה מדינה של ערסים\nאי אפשר לצאת בלי לחטוף שפיץ', 'נסה שוב יא מנייק'],
  ['אייי פונצ׳רט יא מנייק', 'נסה עוד פעם אם ישך אומץ'],
];
const ROCKET_DEATH_TEXTS = [
  ['וואלק שמו בך האירנים המנייק', 'נסה שוב'],
  ['מה הסיכוי שייפול לך טיל על הראש\nכנראה שאלוהים שונא אותך', 'נסה שוב'],
  ['איזה נאחס מתת באירוע פחע\nנזכור אותך לנצח', 'או שתנסה שוב'],
];

function killRunner(killedBy) {
  state = S.DEAD; deadTick = 0; audio.pause(); lastKiller = killedBy;
  playSound(sfxDeaths[Math.floor(Math.random() * sfxDeaths.length)]);
  R.angle = Math.PI;
  R.deadVY = -10;
  R.onGround = false;
}

function updateDead(dt) {
  deadTick += dt;
  R.deadVY += GRAV * 0.7 * dt;
  R.y += R.deadVY * dt;

  if (R.y > canvas.height + 160 || deadTick > 220) {
    state = S.READY;
    ovEl.classList.remove('hidden'); pb.classList.add('hidden');
    if (lastKiller === 'ars') {
      const t = ARS_DEATH_TEXTS[Math.floor(Math.random() * ARS_DEATH_TEXTS.length)];
      ovT.textContent = t[0]; ovS.textContent = t[1];
    } else if (lastKiller === 'rocket') {
      const t = ROCKET_DEATH_TEXTS[Math.floor(Math.random() * ROCKET_DEATH_TEXTS.length)];
      ovT.textContent = t[0]; ovS.textContent = t[1];
    } else {
      ovT.textContent = '💥 עוד פעם!'; ovS.textContent = 'לחץ / הקש לנסות שוב';
    }
    initRunner();
  }
}

function updateEnding(dt) {
  gndScroll = (gndScroll + speed * dt) % 80;
  totalScroll += speed * dt;
  isNight = true;
  advanceMoon(speed * dt, dt);
  physicsStep(dt);
  if (!R.entering) houseX -= canvas.width / 80 * dt;
  if (!R.entering && houseX <= R.x + 55) R.entering = true;
  if (R.entering) {
    R.alpha -= 0.04 * dt; R.x += 2.5 * dt;
    if (R.alpha <= 0) beginCelebration();
  }
  if (!isNaN(audio.duration)) pf.style.width = (audio.currentTime / audio.duration * 100) + '%';
}

function beginCelebration() {
  state = S.CELEBRATION; celebTick = 0; confetti = []; fireworks = [];
  spawnConfetti(120); spawnFirework();
}

function updateCeleb(dt) {
  const prev = celebTick;
  celebTick += dt;
  if (Math.floor(celebTick / 28) > Math.floor(prev / 28)) spawnConfetti(60);
  if (Math.floor(celebTick / 55) > Math.floor(prev / 55)) spawnFirework();
  confetti  = confetti.filter(p => { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.06*dt; p.rot+=p.rotV*dt; p.life-=0.004*dt; return p.life>0&&p.y<canvas.height+60; });
  fireworks = fireworks.filter(p => { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.12*dt; p.vx*=Math.pow(0.97,dt); p.life-=0.013*dt; return p.life>0; });
}

function spawnConfetti(n) {
  const cols=['#ff4444','#ff88bb','#ffcc00','#44ff88','#44aaff','#cc44ff','#fff','#ffaa44'];
  for (let i=0;i<n;i++) confetti.push({
    x:Math.random()*canvas.width, y:-10-Math.random()*canvas.height*.4,
    vx:(Math.random()-.5)*3, vy:1.5+Math.random()*4,
    rot:Math.random()*Math.PI*2, rotV:(Math.random()-.5)*.18,
    color:cols[Math.floor(Math.random()*cols.length)],
    w:7+Math.random()*9, h:3+Math.random()*5, life:.8+Math.random()*.2
  });
}

function spawnFirework() {
  const fx=80+Math.random()*(canvas.width-160), fy=40+Math.random()*canvas.height*.45, hue=Math.random()*360;
  for (let i=0;i<50;i++) {
    const a=Math.PI*2*i/50, sp=3+Math.random()*6;
    fireworks.push({ x:fx,y:fy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      color:`hsl(${hue+Math.random()*30},90%,${55+Math.random()*20}%)`,
      r:2.5+Math.random()*3, life:1 });
  }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawSky();
  drawMoon();
  drawClouds();
  drawGround();

  if (state === S.CELEBRATION) {
    drawHouse(houseX, GND()); drawCelebParticles(); drawCelebText(); return;
  }

  for (const o of obstacles) {
    if (o.type === 'ars') drawArs(o.x, o.y, o.count, o.tall, o.imgIdxs);
    else                  drawRocketObs(o.x, o.y);
  }
  if (houseActive) drawHouse(houseX, GND());

  if (state === S.PLAYING || state === S.DEAD || state === S.ENDING) {
    if (R.alpha > 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, R.alpha);
      drawRunner(R.x, R.y, fc, !R.onGround, R.angle, state === S.DEAD);
      ctx.restore();
    }
  }
}

// ── Sky ───────────────────────────────────────────────────────────────────────
function drawSky() {
  if (isNight) {
    const g = ctx.createLinearGradient(0, 0, 0, GND());
    g.addColorStop(0, '#07071a'); g.addColorStop(0.5, '#0f0f2e'); g.addColorStop(1, '#1a1a40');
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Pixel stars (deterministic positions)
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 70; i++) {
      const sx = (i * 6271 + 42 * 1009) % canvas.width;
      const sy = (i * 3847 + 42 * 719) % (GND() * 0.88);
      ctx.fillRect(Math.round(sx), Math.round(sy), i % 4 === 0 ? 2 : 1, i % 4 === 0 ? 2 : 1);
    }
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, GND());
    g.addColorStop(0,'#4fc3f7'); g.addColorStop(.6,'#87CEEB'); g.addColorStop(1,'#c9eeff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

// ── Moon (crescent, parallax) ─────────────────────────────────────────────────
function drawMoon() {
  if (moonAlpha <= 0) return;
  const r = Math.max(20, Math.min(canvas.width, canvas.height) * 0.046);
  // Slow parallax: moon drifts at ~8% of scroll speed
  const mx = ((canvas.width * 0.78 - moonOff * 0.08) % canvas.width + canvas.width) % canvas.width;
  const my = canvas.height * 0.17;
  ctx.save();
  ctx.globalAlpha = moonAlpha;
  // Full disc
  ctx.fillStyle = '#faf0b0';
  ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
  // Crescent shadow (night sky color overlay)
  ctx.fillStyle = '#0f0f2e';
  ctx.beginPath(); ctx.arc(mx + r * 0.42, my - r * 0.04, r * 0.84, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ── Clouds (pixel-art style, hidden at night) ─────────────────────────────────
let cloudOff = 0;
const CL = [
  {fx:.12, fy:.07, w:90,  h:30},
  {fx:.40, fy:.10, w:110, h:36},
  {fx:.68, fy:.06, w:80,  h:26},
  {fx:.88, fy:.12, w:96,  h:32}
];
function drawClouds() {
  if (isNight) return;
  cloudOff = (cloudOff + .22) % canvas.width;
  ctx.fillStyle = 'rgba(255,255,255,.90)';
  for (const c of CL) {
    const cx = Math.round((c.fx * canvas.width - cloudOff * .38 + canvas.width * 2) % canvas.width);
    const cy = Math.round(c.fy * canvas.height);
    const w = c.w, h = c.h;
    // Stacked rects = pixel art cloud shape
    ctx.fillRect(cx,         cy + h*0.45|0, w,        h*0.55|0);
    ctx.fillRect(cx + w*.1|0, cy + h*.18|0, w*0.75|0, h*0.55|0);
    ctx.fillRect(cx + w*.28|0, cy,          w*0.55|0, h*0.52|0);
    ctx.fillRect(cx - w*.04|0, cy + h*.22|0, w*0.42|0, h*0.48|0);
  }
}

// ── Ground (with T-Rex-style imperfections) ───────────────────────────────────
function drawGround() {
  const gy = GND();

  // Fill
  if (isNight) {
    ctx.fillStyle = '#26263a';
  } else {
    const g = ctx.createLinearGradient(0, gy, 0, canvas.height);
    g.addColorStop(0,'#7dcf52'); g.addColorStop(.12,'#5aaa38'); g.addColorStop(1,'#3a7020');
    ctx.fillStyle = g;
  }
  ctx.fillRect(0, gy, canvas.width, canvas.height - gy);

  // Main ground line
  ctx.fillStyle = isNight ? '#9090a8' : '#4a8a30';
  ctx.fillRect(0, gy, canvas.width, 2);

  // Second line (T-Rex style)
  ctx.fillStyle = isNight ? '#585870' : '#3a7020';
  ctx.fillRect(0, gy + 8, canvas.width, 2);

  // Tiled bumps / imperfections
  ctx.fillStyle = isNight ? '#6a6a80' : '#5aa028';
  const offset = totalScroll % BUMP_TILE;
  const tilesNeeded = Math.ceil(canvas.width / BUMP_TILE) + 2;
  for (const b of gndBumps) {
    for (let t = 0; t < tilesNeeded; t++) {
      const bx = Math.round(b.x - offset + t * BUMP_TILE);
      if (bx > -20 && bx < canvas.width + 20) {
        ctx.fillRect(bx, gy - b.h, b.w, b.h);
      }
    }
  }
}

// ── Runner (pixel art) ────────────────────────────────────────────────────────
// x,y = feet. angle = Math.PI when dead (flipped). dead = show X eyes.
function drawRunner(x, y, _fc, jumping, angle, dead) {
  ctx.save();
  ctx.translate(x, y);
  if (angle) ctx.rotate(angle);

  const ph = jumping ? 2 : Math.floor(_fc / 9) % 2;

  // ── Shoes ──
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1;
  if (ph === 0) {
    ctx.fillRect(-18,-12,16,10); ctx.strokeRect(-18,-12,16,10);
    ctx.fillRect(2,-8,14,8);    ctx.strokeRect(2,-8,14,8);
  } else if (ph === 1) {
    ctx.fillRect(-16,-8,14,8);  ctx.strokeRect(-16,-8,14,8);
    ctx.fillRect(2,-12,16,10);  ctx.strokeRect(2,-12,16,10);
  } else {
    ctx.fillRect(-18,-16,16,8); ctx.strokeRect(-18,-16,16,8);
    ctx.fillRect(2,-14,16,8);   ctx.strokeRect(2,-14,16,8);
  }

  // ── Legs ──
  ctx.fillStyle = '#2a2a5a';
  if (ph === 0) {
    ctx.fillRect(-12,-12,10,24); ctx.fillRect(2,-8,10,22);
  } else if (ph === 1) {
    ctx.fillRect(-12,-8,10,22);  ctx.fillRect(2,-12,10,24);
  } else {
    ctx.fillRect(-14,-16,10,26); ctx.fillRect(2,-14,10,26);
  }

  // ── Shorts ──
  ctx.fillStyle = '#2a2a5a';
  ctx.fillRect(-14,-40,28,16);
  ctx.fillStyle = '#3a3a8a';
  ctx.fillRect(-14,-40,4,16); ctx.fillRect(10,-40,4,16); // stripes

  // ── Shirt ──
  ctx.fillStyle = '#4a90d9';
  ctx.fillRect(-13,-66,26,28);
  ctx.fillStyle = '#3a80c9';
  ctx.fillRect(-13,-66,26,4); // collar stripe
  // Pixel "1"
  ctx.fillStyle = '#fff';
  ctx.fillRect(-2,-62,4,16);   // bar
  ctx.fillRect(-4,-62,8,4);    // top flag
  ctx.fillRect(-4,-46,8,4);    // base

  // ── Arms ──
  ctx.fillStyle = '#c8844a';
  if (ph === 0) {
    ctx.fillRect(-23,-64,10,22); ctx.fillRect(13,-74,10,22);
  } else if (ph === 1) {
    ctx.fillRect(-23,-74,10,22); ctx.fillRect(13,-64,10,22);
  } else {
    ctx.fillRect(-24,-74,10,20); ctx.fillRect(14,-74,10,20);
  }

  // ── Neck ──
  ctx.fillStyle = '#f5c87a';
  ctx.fillRect(-5,-70,10,6);

  // ── Head (square) ──
  ctx.fillStyle = '#f5c87a';
  ctx.fillRect(-14,-96,28,28);

  // ── Ears ──
  ctx.fillRect(-18,-88,4,10); ctx.fillRect(14,-88,4,10);

  // ── Hair (dark block + pixel spikes) ──
  ctx.fillStyle = '#2a1400';
  ctx.fillRect(-14,-96,28,10);
  ctx.fillRect(-12,-108,6,14);
  ctx.fillRect(-4,-112,6,18);
  ctx.fillRect(2,-110,6,16);
  ctx.fillRect(8,-106,6,12);

  // ── Eyes ──
  if (dead) {
    // X eyes
    ctx.fillStyle = '#333';
    ctx.fillRect(-10,-86,2,2); ctx.fillRect(-6,-82,2,2);
    ctx.fillRect(-10,-82,2,2); ctx.fillRect(-6,-86,2,2);
    ctx.fillRect(2,-86,2,2);   ctx.fillRect(6,-82,2,2);
    ctx.fillRect(2,-82,2,2);   ctx.fillRect(6,-86,2,2);
  } else {
    ctx.fillStyle = 'white';
    ctx.fillRect(-10,-86,8,8); ctx.fillRect(2,-86,8,8);
    ctx.fillStyle = '#333';
    ctx.fillRect(-8,-84,4,4);  ctx.fillRect(4,-84,4,4);
    ctx.fillStyle = 'white';
    ctx.fillRect(-7,-85,2,2);  ctx.fillRect(5,-85,2,2);
    // Pixel smile
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(-5,-74,2,2);
    ctx.fillRect(-3,-72,8,2);
    ctx.fillRect(5,-74,2,2);
  }

  ctx.restore();
}

// ── ערס obstacle (pixel art) ──────────────────────────────────────────────────
function drawArs(x, y, count, tall, imgIdxs) {
  const W=34, GAP=6, totalW=count*W+(count-1)*GAP;
  for (let i=0; i<count; i++) {
    drawOneArs(x - totalW/2 + i*(W+GAP) + W/2, y, tall, i%2===1, arsImgs[imgIdxs[i]]);
  }
}

function drawOneArs(x, y, tall, flip, img) {
  const drawH = tall ? 120 : 90;
  const drawW = img.complete && img.naturalWidth ? drawH * img.naturalWidth / img.naturalHeight : drawH * 0.42;
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.fillRect(-drawW/2 - 2, -3, drawW + 4, 5);
  if (img.complete && img.naturalWidth) ctx.drawImage(img, -drawW/2, -drawH, drawW, drawH);
  ctx.restore();
}

// ── Rocket obstacle (pixel art) ───────────────────────────────────────────────
function drawRocketObs(x, y) {
  if (!missileImg.complete || !missileImg.naturalWidth) return;
  const drawW = 120, drawH = 36;
  ctx.save();
  ctx.translate(x, y);
  ctx.drawImage(missileImg, -drawW/2, -drawH/2, drawW, drawH);
  ctx.restore();
}

// ── House + palm tree (unchanged) ─────────────────────────────────────────────
function drawHouse(cx, gy) {
  const W=220, H=165;
  ctx.save(); ctx.translate(cx, gy);
  ctx.fillStyle='rgba(0,0,0,.12)';
  ctx.beginPath(); ctx.ellipse(15,4,155,13,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f5e6c8'; ctx.strokeStyle='#c4a46b'; ctx.lineWidth=2;
  ctx.fillRect(-W/2,-H,W,H); ctx.strokeRect(-W/2,-H,W,H);
  ctx.fillStyle='#e05a2b'; ctx.strokeStyle='#b03a1b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-W/2-15,-H); ctx.lineTo(0,-H-68); ctx.lineTo(W/2+15,-H); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#c0704a'; ctx.strokeStyle='#8b4a2a'; ctx.lineWidth=1.5;
  ctx.fillRect(55,-H-48,22,38); ctx.strokeRect(55,-H-48,22,38);
  for (const wx of [-W/2+18, W/2-58]) {
    ctx.fillStyle='#aaddff'; ctx.strokeStyle='#6699bb'; ctx.lineWidth=1.5;
    ctx.fillRect(wx,-H+28,40,34); ctx.strokeRect(wx,-H+28,40,34);
    ctx.beginPath();
    ctx.moveTo(wx+20,-H+28); ctx.lineTo(wx+20,-H+62);
    ctx.moveTo(wx,-H+45);    ctx.lineTo(wx+40,-H+45); ctx.stroke();
  }
  const dW=52, dH=72;
  ctx.fillStyle='#8B5E3C'; ctx.strokeStyle='#5a3a1a'; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(-dW/2,0); ctx.lineTo(-dW/2,-dH);
  ctx.quadraticCurveTo(-dW/2,-dH-10,0,-dH-10);
  ctx.quadraticCurveTo(dW/2,-dH-10,dW/2,-dH);
  ctx.lineTo(dW/2,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ffd700';
  ctx.beginPath(); ctx.arc(dW/2-10,-dH/2,5,0,Math.PI*2); ctx.fill();
  const tx=W/2+45;
  ctx.strokeStyle='#8B6914'; ctx.lineWidth=10; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(tx,0); ctx.bezierCurveTo(tx+12,-35,tx+6,-68,tx-6,-105); ctx.stroke();
  for (const [a,c] of [[-0.5,'#3a9a2a'],[0.35,'#4ab83a'],[1.1,'#5acc4a'],[-1.4,'#3a9a2a'],[-2.1,'#4ab83a']]) {
    ctx.save(); ctx.translate(tx-6,-105); ctx.rotate(a);
    ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(28,0,32,9,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  ctx.fillStyle='#8B4513';
  ctx.beginPath(); ctx.arc(tx-3,-92,7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(tx-13,-98,7,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── Celebration ───────────────────────────────────────────────────────────────
function drawCelebParticles() {
  for (const p of fireworks) {
    ctx.save(); ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  for (const p of confetti) {
    ctx.save(); ctx.globalAlpha=p.life; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  }
}

function drawCelebText() {
  if (celebTick < 30) return;
  const pulse=1+Math.sin(fc*.07)*.05, fs=Math.min(canvas.width*.085,64);
  ctx.save(); ctx.translate(canvas.width/2, canvas.height*.33); ctx.scale(pulse,pulse);
  ctx.font=`bold ${fs}px Arial,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.direction='rtl';
  const line1='ווהוו סברדי הגיע בשלום לאולפן 🎉', line2='עכשיו הוא ואדם בלאגן יכולים לבשל עוד באנגרים 🏠';
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillText(line1,3,3); ctx.fillText(line2,3,fs+15);
  ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.lineJoin='round';
  ctx.strokeText(line1,0,0); ctx.strokeText(line2,0,fs+12);
  const rg=ctx.createLinearGradient(-fs*3,0,fs*3,0);
  rg.addColorStop(0,'#ff4444'); rg.addColorStop(.25,'#ffcc00');
  rg.addColorStop(.5,'#44ff88'); rg.addColorStop(.75,'#44aaff'); rg.addColorStop(1,'#cc44ff');
  ctx.fillStyle=rg; ctx.fillText(line1,0,0); ctx.fillText(line2,0,fs+12);
  ctx.restore();
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let lastTs = 0;
function loop(ts) {
  const dt = lastTs ? Math.min((ts - lastTs) / (1000 / 60), 3) : 1;
  lastTs = ts;
  update(dt); render(); requestAnimationFrame(loop);
}
audio.load();
requestAnimationFrame(loop);
</script>

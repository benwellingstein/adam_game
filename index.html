<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quack!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background-color: #87CEEB;
      transition: background-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    #quack-btn {
      position: absolute;
      font-size: 2rem;
      padding: 20px 40px;
      border: none;
      border-radius: 50px;
      background: #FFD700;
      color: #333;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transition: transform 0.1s;
      user-select: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #quack-btn:active { transform: translate(-50%, -50%) scale(0.9); }
  </style>
</head>
<body>
  <button id="quack-btn">🦆 QUACK</button>

  <script>
    const btn = document.getElementById('quack-btn');
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    function playQuack() {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.type = 'sawtooth';
      const now = ctx.currentTime;

      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.18);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.28);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.42);

      gain.gain.setValueAtTime(0.0, now);
      gain.gain.linearRampToValueAtTime(0.5, now + 0.02);
      gain.gain.setValueAtTime(0.5, now + 0.25);
      gain.gain.linearRampToValueAtTime(0.0, now + 0.45);

      osc.start(now);
      osc.stop(now + 0.45);
    }

    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 60%, 70%)`;
    }

    function moveButton() {
      const bw = btn.offsetWidth;
      const bh = btn.offsetHeight;
      const maxX = window.innerWidth - bw;
      const maxY = window.innerHeight - bh;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      btn.style.transform = 'none';
    }

    btn.addEventListener('click', () => {
      playQuack();
      document.body.style.backgroundColor = randomColor();
      moveButton();
    });
  </script>
</body>
</html>
